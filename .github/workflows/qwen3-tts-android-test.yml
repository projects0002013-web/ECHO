name: Experimental on-device Qwen3 TTS (separate APK)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/qwen3-tts-android-test.yml'
permissions:
  contents: read

jobs:
  build-qwen-experiment:
    name: Build isolated Qwen3 TTS test APK
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Check out ECHO
        uses: actions/checkout@v4
      - name: Fetch upstream Android voice cloning project
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/Danmoreng/qwen3-tts-android.git qwen3-experiment
          git -C qwen3-experiment submodule update --init --recursive
          git -C qwen3-experiment rev-parse HEAD | tee qwen3-experiment-source-commit.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Build experimental APK (does not modify ECHO)
        working-directory: qwen3-experiment
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug -Pqwen.openmp=false -Pqwen.vulkan=false -Pqwen.opencl=false
      - name: Upload separate experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-tts-android-experimental-debug
          path: qwen3-experiment/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload upstream revision used
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-experiment-source-revision
          path: qwen3-experiment-source-commit.txt
          retention-days: 7
