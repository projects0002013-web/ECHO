name: Android debug shell
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'mobile-voice.js'
      - 'index.html'
      - 'script.js'
      - 'features.js'
      - 'i18n.js'
      - 'style.css'
      - 'features.css'
      - '.github/workflows/android-debug.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'mobile-voice.js'
      - 'features.js'
      - 'script.js'
      - 'index.html'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Package offline assets
        shell: pwsh
        run: ./mobile/package-web.ps1
      - name: Install Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle -p mobile/android --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: echo-android-shell-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
