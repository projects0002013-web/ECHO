name: Android Executive Light APK
on:
  push:
    branches: [main, feature/echo-executive-light-offline-voice, feature/echo-1-0-release-hardening]
    paths:
      - 'mobile/**'
      - '*.js'
      - '*.css'
      - '*.png'
      - 'index.html'
      - 'manifest.json'
      - 'locales/**'
      - 'fonts/**'
      - '.github/workflows/android-debug.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '*.js'
      - '*.css'
      - '*.png'
      - 'index.html'
      - 'manifest.json'
      - 'locales/**'
      - 'fonts/**'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install pinned offline PocketTTS Android runtime
        run: python3 mobile/android/prepare-pocket-runtime.py
      - name: Bundle PocketTTS English model for fully offline generation
        run: python3 mobile/android/prepare-pocket-model.py
      - name: Package offline assets
        run: python3 mobile/package-web.py
      - name: Install Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle -p mobile/android --no-daemon assembleDebug
      - name: Verify packaged Executive Light assets
        run: python3 mobile/check-apk.py mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Verify isolated test-app identity and signature
        run: |
          set -euo pipefail
          APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          AAPT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0/aapt"
          SIGNER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | grep -F "package: name='org.echo.aac.preview'"
          "$AAPT" dump badging "$APK" | grep -F "application-label:'ECHO Тест'"
          "$SIGNER" verify "$APK"
          echo "This is a separate test package; never uninstall production ECHO." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: echo-executive-light-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk*
          if-no-files-found: error

  android-real-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: python3 mobile/android/prepare-pocket-runtime.py
      - run: python3 mobile/android/prepare-pocket-model.py
      - run: python3 mobile/package-web.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android JNI inference, recovery, cancellation, and MediaPlayer WAV playback
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            bash mobile/run-android-inference-tests.sh
      - name: Assert and summarize executed Android inference tests
        if: always()
        run: python3 mobile/summarize-android-tests.py
      - name: Upload Android inference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-android-inference-results
          path: |
            mobile/android/app/build/reports/androidTests/
            mobile/android/app/build/outputs/androidTest-results/
            mobile/android/app/build/outputs/androidTest-results/echo-emulator-*.txt
            mobile/android/app/build/outputs/androidTest-results/echo-emulator-*.log
          if-no-files-found: warn
