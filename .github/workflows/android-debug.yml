name: Android Executive Light APK
on:
  push:
    branches: [main, feature/echo-executive-light-offline-voice]
    paths:
      - 'mobile/**'
      - '*.js'
      - '*.css'
      - '*.png'
      - 'index.html'
      - 'manifest.json'
      - 'locales/**'
      - 'fonts/**'
      - '.github/workflows/android-debug.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '*.js'
      - '*.css'
      - '*.png'
      - 'index.html'
      - 'manifest.json'
      - 'locales/**'
      - 'fonts/**'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Package offline assets
        run: python3 mobile/package-web.py
      - name: Install Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle -p mobile/android --no-daemon assembleDebug
      - name: Verify packaged Executive Light assets
        run: python3 mobile/check-apk.py mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: echo-executive-light-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
