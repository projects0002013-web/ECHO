name: PocketTTS Real ONNX Inference Smoke
on:
  push:
    branches: [feature/echo-executive-light-offline-voice]
    paths:
      - 'mobile/android/prepare-pocket-model.py'
      - 'mobile/android/app/src/main/java/org/echo/aac/PocketTtsEngine.java'
      - 'mobile/android/app/src/main/java/org/echo/aac/PocketReferenceAudio.java'
      - 'tests/java/PocketTtsInferenceSmoke.java'
      - '.github/workflows/pocket-inference.yml'
  workflow_dispatch:
jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and SHA-256 verify real PocketTTS model
        run: python3 mobile/android/prepare-pocket-model.py
      - name: Fetch verified official JVM and Linux native releases
        run: |
          set -euo pipefail
          mkdir -p /tmp/echo-ai
          BASE=https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1
          curl --fail --location --retry 3 "${BASE}/sherpa-onnx-jvm-2.0.1.jar" -o /tmp/echo-ai/sherpa-onnx-jvm-2.0.1.jar
          curl --fail --location --retry 3 "${BASE}/sherpa-onnx-native-lib-linux-x64-2.0.1.jar" -o /tmp/echo-ai/sherpa-onnx-native-lib-linux-x64-2.0.1.jar
          echo "8320e2457b6e38dd624fb619d3552e11ef78ffeb394622056126b16f2fd99d12  /tmp/echo-ai/sherpa-onnx-jvm-2.0.1.jar" | sha256sum --check
          echo "744330a68a7024d9412f029c23b06f847b8444787c94e5118e0fdaf1b4b2cb3f  /tmp/echo-ai/sherpa-onnx-native-lib-linux-x64-2.0.1.jar" | sha256sum --check
      - name: Compile and run real (non-mock) ONNX inference
        run: |
          set -euo pipefail
          JVM=/tmp/echo-ai/sherpa-onnx-jvm-2.0.1.jar
          NATIVE=/tmp/echo-ai/sherpa-onnx-native-lib-linux-x64-2.0.1.jar
          mkdir -p /tmp/echo-ai/classes
          javac -encoding UTF-8 -cp "$JVM" -d /tmp/echo-ai/classes \
            mobile/android/app/src/main/java/org/echo/aac/PocketReferenceAudio.java \
            mobile/android/app/src/main/java/org/echo/aac/PocketTtsEngine.java \
            tests/java/PocketTtsInferenceSmoke.java
          java -Xmx4g -cp "/tmp/echo-ai/classes:$JVM:$NATIVE" PocketTtsInferenceSmoke \
            mobile/android/app/src/main/assets/pockettts
          echo "This technical smoke uses synthetic audio; it does not prove Android performance or voice likeness." >> "$GITHUB_STEP_SUMMARY"
