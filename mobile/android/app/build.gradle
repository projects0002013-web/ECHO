plugins { id 'com.android.application' }
android {
  namespace 'org.echo.aac'
  compileSdk 35
  defaultConfig {
    applicationId 'org.echo.aac'
    minSdk 26
    targetSdk 35
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    versionCode 3
    versionName '1.0-executive-debug'
  }
  // Debug builds are isolated from the stable user installation and storage.
  // They CANNOT be used to test in-place upgrades of the production package.
  buildTypes {
    debug {
      applicationIdSuffix '.preview'
      versionNameSuffix '-preview'
    }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
  implementation 'androidx.webkit:webkit:1.12.1'
  // Official sherpa-onnx 2.0.1 JVM API, SHA-256 verified before build by prepare-pocket-runtime.py.
  implementation files('libs/sherpa-onnx-jvm-2.0.1.jar')
}
