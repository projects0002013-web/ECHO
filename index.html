<!DOCTYPE html>
<html lang="ru">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <meta content="#f4f8f7" name="theme-color"/>
  <meta content="ECHO — приложение альтернативной коммуникации. Твой голос рядом." name="description"/>
  <title>
   ECHO — твой голос
  </title>
  <link href="style.css" rel="stylesheet"/>
  <link href="features.css" rel="stylesheet"/>
  <link href="manifest.json" rel="manifest"/>
  <meta property="og:title" content="ECHO — эхо твоих слов"/>
  <meta property="og:description" content="Простой локальный коммуникатор с персональным голосом."/>
  <meta property="og:image" content="cover.png"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <link href="icon-192.png?v=6" rel="icon"/>
  <link href="icon-512.png?v=6" rel="apple-touch-icon"/>
 </head>
 <body>
  <div class="app">
   <header class="header">
    <div class="logo">
     <img class="logo-icon echo-brand-icon" src="icon-192.png?v=6" width="54" height="54" alt=""/>
     <div>
      <h1>
       ECHO
      </h1>
      <p>
       Эхо твоих слов
      </p>
     </div>
    </div>
    <button aria-label="Настройки" class="settings-btn" type="button">
     ⚙
    </button>
   </header>
   <main>
    <section class="welcome">
     <p class="small-title">
      БЫСТРЫЕ ФРАЗЫ
     </p>
     <h2>
      Что ты хочешь сказать?
     </h2>
     <p class="description">
      Нажми на карточку — ECHO произнесёт фразу за тебя.
     </p>
    </section>
    <section class="phrase-grid">
     <button class="phrase-card" data-category="food" data-text="Я хочу пить" onclick="speakPhrase(this)" type="button">
      <span class="phrase-icon">
       💧
      </span>
      <span class="phrase-name">
       Вода
      </span>
      <span class="phrase-text">
       Я хочу пить
      </span>
      <span class="sound-icon">
       🔊
      </span>
     </button>
     <button class="phrase-card" data-category="food" data-text="Я хочу есть" onclick="speakPhrase(this)" type="button">
      <span class="phrase-icon">
       🍎
      </span>
      <span class="phrase-name">
       Еда
      </span>
      <span class="phrase-text">
       Я хочу есть
      </span>
      <span class="sound-icon">
       🔊
      </span>
     </button>
     <button class="phrase-card" data-category="help" data-text="Мне нужна помощь" onclick="speakPhrase(this)" type="button">
      <span class="phrase-icon">
       🆘
      </span>
      <span class="phrase-name">
       Помощь
      </span>
      <span class="phrase-text">
       Мне нужна помощь
      </span>
      <span class="sound-icon">
       🔊
      </span>
     </button>
     <button class="phrase-card" data-category="communication" data-text="Я хочу домой" onclick="speakPhrase(this)" type="button">
      <span class="phrase-icon">
       🏠
      </span>
      <span class="phrase-name">
       Домой
      </span>
      <span class="phrase-text">
       Я хочу домой
      </span>
      <span class="sound-icon">
       🔊
      </span>
     </button>
     <button class="phrase-card" data-category="communication" data-text="Да" onclick="speakPhrase(this)" type="button">
      <span class="phrase-icon">
       👍
      </span>
      <span class="phrase-name">
       Да
      </span>
      <span class="phrase-text">
       Да
      </span>
      <span class="sound-icon">
       🔊
      </span>
     </button>
     <button class="phrase-card" data-category="communication" data-text="Нет" onclick="speakPhrase(this)" type="button">
      <span class="phrase-icon">
       👎
      </span>
      <span class="phrase-name">
       Нет
      </span>
      <span class="phrase-text">
       Нет
      </span>
      <span class="sound-icon">
       🔊
      </span>
     </button>
    </section>
    <section class="custom-section">
     <p class="small-title">
      СВОЯ ФРАЗА
     </p>
     <div class="custom-box">
      <input aria-label="Текст своей фразы" autocomplete="off" id="customPhrase" maxlength="300" placeholder="Напишите сообщение..." type="text"/>
      <button aria-label="Произнести сообщение" class="speak-custom" onclick="speakCustomPhrase()" type="button">
       🔊
      </button>
     </div>
    </section>
    <div class="modal" id="addPhraseModal">
     <div class="modal-box">
      <div class="modal-header">
       <div>
        <p class="small-title">
         НОВАЯ КАРТОЧКА
        </p>
        <h2>
         Добавить фразу
        </h2>
       </div>
       <button aria-label="Закрыть" class="close-modal" id="closeModal" type="button">
        ✕
       </button>
      </div>
      <label class="field-label">
       Иконка
      </label>
      <div class="emoji-list">
       <button class="emoji-option selected" type="button">
        💧
       </button>
       <button class="emoji-option" type="button">
        🍎
       </button>
       <button class="emoji-option" type="button">
        🆘
       </button>
       <button class="emoji-option" type="button">
        🏠
       </button>
       <button class="emoji-option" type="button">
        ❤️
       </button>
       <button class="emoji-option" type="button">
        💊
       </button>
       <button class="emoji-option" type="button">
        😣
       </button>
       <button class="emoji-option" type="button">
        🚻
       </button>
      </div>
      <label class="field-label" for="newPhraseName">
       Название
      </label>
      <input class="modal-input" id="newPhraseName" maxlength="40" placeholder="Например: Голова" type="text"/>
      <label class="field-label" for="newPhraseText">
       Что должен сказать ECHO?
      </label>
      <textarea class="modal-input modal-textarea" id="newPhraseText" maxlength="300" placeholder="Например: У меня болит голова"></textarea>
      <button class="save-phrase" id="savePhrase" type="button">
       Сохранить фразу
      </button>
     </div>
    </div>
   </main>
   <nav aria-label="Основная навигация" class="bottom-nav">
    <button class="nav-item active" id="phrasesTab" type="button">
     <span>
      💬
     </span>
     <small>
      Фразы
     </small>
    </button>
    <button class="nav-item" id="favoritesTab" type="button">
     <span>
      ⭐
     </span>
     <small>
      Избранное
     </small>
    </button>
    <button class="nav-item add-button" type="button">
     <span>
      ＋

     </span>
     <small>
      Добавить
     </small>
    </button>
    <button class="nav-item" id="settingsTab" type="button">
     <span>
      ⚙
     </span>
     <small>
      Настройки
     </small>
    </button>
   </nav>
  </div>
  <script onerror="alert('Не найден script.js. Проверь, что index.html и script.js лежат в одной папке.')" src="script.js">
  </script>
  <script src="features.js"></script>
  <script>
    if ("serviceWorker" in navigator && window.isSecureContext) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(error => console.warn("ECHO: офлайн-режим недоступен", error)));
    }
  </script>
 </body>
</html>
